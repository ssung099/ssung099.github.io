{{- $src := .Destination -}}
{{- if and .Page.File (not (findRE `^([A-Za-z][A-Za-z0-9+.-]*:|/)` $src)) -}}
  {{- $src = printf "/%s" (path.Join .Page.File.Dir $src) -}}
{{- end -}}
<img
  src="{{ $src | safeURL }}"
  alt="{{ .PlainText }}"
  loading="lazy"
  decoding="async"
  class="full-width"
/>
